name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATALENS_MODEL_SAMPLE_ROWS: "10000"
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
      - name: Lint
        run: python -m ruff check app.py src tests
      - name: Test on Python 3.11
        if: matrix.python-version == '3.11'
        run: python -m pytest -W error -m "not full"
      - name: Test with branch coverage on Python 3.12
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -W error
          -m "not full"
          --cov=src
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned runtime and development dependencies
        run: python -m pip_audit --requirement requirements-dev.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container health and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: datalens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify health endpoint
        run: |
          docker run --detach --name datalens-ci --publish 8501:8501 datalens:ci
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs datalens-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm --force datalens-ci || true
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datalens:ci
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
